[project]
name = "borderflow-ref"
version = "1.0.0"
description = "Reference implementation of BorderFlow: boundary-enforced information-flow control for the Agent-to-Agent (A2A) protocol"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sunera Godakanda" }]
dependencies = [
  "a2a-sdk[http-server]==1.3.0",
  "starlette>=0.40",
  "httpx>=0.27",
  "uvicorn>=0.30",
  "cryptography>=42",
  "protobuf>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8"]

[tool.setuptools]
packages = ["borderflow", "agents", "experiments"]

[tool.pytest.ini_options]
testpaths = ["tests"]
